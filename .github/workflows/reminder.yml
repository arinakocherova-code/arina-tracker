name: Напоминание про трекер

on:
  # Встроенный cron GitHub Actions снят: у бесплатных расписаний нет гарантии
  # точного времени (наблюдалась стабильная задержка ~4.5 часа). Вместо него
  # workflow запускает внешний cron-сервис через API в момент дедлайна —
  # см. sessions/active/2026-07-18_008_telegram-трекер/memory.md.
  workflow_dispatch: {}     # можно запустить вручную кнопкой Run workflow — для проверки

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Разослать напоминания всем из allowed-ids.txt
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TEXT="Не забудь заглянуть в трекер сегодня 🌿"
          while IFS= read -r line; do
            id=$(echo "$line" | awk '{print $1}')
            if [[ "$id" =~ ^[0-9]+$ ]]; then
              resp=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${id}" \
                --data-urlencode "text=${TEXT}")
              echo "id=${id} response=${resp}"
            fi
          done < allowed-ids.txt
